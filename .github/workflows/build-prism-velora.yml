name: Build Velora Studio (PRISM Base - Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-velora-studio:
    runs-on: windows-2022

    steps:
      - name: Checkout Velora Studio Customizations
        uses: actions/checkout@v4
        with:
          path: velora-custom

      - name: Checkout PRISM Live Studio Base
        uses: actions/checkout@v4
        with:
          repository: naver/prism-live-studio
          submodules: recursive
          path: prism-src
          fetch-depth: 0

      - name: Setup MSBuild & Visual Studio 2022
        uses: microsoft/setup-msbuild@v2

      - name: Setup Qt 6.3.1 (Full Desktop Module Suite)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.3.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: '${{ runner.temp }}'
          modules: 'qtmultimedia qtnetworkauth qtwebsockets qt5compat qtimageformats qtshadertools'

      - name: Set Qt Environment Variables
        shell: bash
        run: |
          echo "QT631=$QTDIR" >> $GITHUB_ENV
          echo "QTDIR=$QTDIR" >> $GITHUB_ENV
          echo "QT_ROOT=$QTDIR" >> $GITHUB_ENV
          echo "QTDIR_RelWithDebInfo=$QTDIR" >> $GITHUB_ENV
          echo "QTDIR_Release=$QTDIR" >> $GITHUB_ENV
          echo "QTDIR_Debug=$QTDIR" >> $GITHUB_ENV

      - name: Apply Velora Studio Branding, Colors & Ingest Presets
        shell: bash
        run: |
          bash velora-custom/scripts/rebrand-prism-to-velora.sh prism-src

      - name: Configure CMake & Generate Solution
        shell: cmd
        working-directory: prism-src/build/windows
        run: |
          echo QT631 is %QT631%
          echo QTDIR is %QTDIR%
          configure.cmd

      - name: Build Velora Studio with MSBuild
        shell: cmd
        run: |
          for /R prism-src %%f in (*.sln) do (
            echo Building Solution: %%f
            msbuild "%%f" /p:Configuration=RelWithDebInfo /p:Platform=x64 /m /verbosity:minimal
          )

      - name: Package Velora Studio Artifacts
        shell: bash
        run: |
          mkdir -p dist
          echo "Packaging compiled Velora Studio binaries..."
          if [ -d "prism-src/bin/prism" ]; then
            cp -r prism-src/bin/prism/* dist/ 2>/dev/null || true
          fi
          find prism-src -type f \( -name "*.exe" -o -name "*.dll" \) ! -path "*/.git/*" -exec cp -t dist {} + 2>/dev/null || true
          ls -la dist/ || true

      - name: Upload Velora Studio Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velora-Studio-Windows-x64
          path: dist/
          if-no-files-found: warn
