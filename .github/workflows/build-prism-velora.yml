name: Build Velora Studio (PRISM Base - Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-velora-studio:
    runs-on: windows-2022

    steps:
      - name: Checkout Velora Studio Customizations
        uses: actions/checkout@v4
        with:
          path: velora-custom

      - name: Checkout PRISM Live Studio Base
        uses: actions/checkout@v4
        with:
          repository: naver/prism-live-studio
          submodules: recursive
          path: prism-src
          fetch-depth: 0

      - name: Setup MSBuild & Visual Studio 2022
        uses: microsoft/setup-msbuild@v2

      - name: Setup Qt 6.5.3 (LTS Full Module Suite)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: '${{ runner.temp }}'
          modules: 'qtmultimedia qtnetworkauth qtwebsockets qt5compat qtimageformats qtshadertools'

      - name: Set Qt Environment Variables
        shell: bash
        run: |
          QT_PATH="${{ runner.temp }}/Qt/6.5.3/msvc2019_64"
          echo "QTDIR=$QT_PATH" >> $GITHUB_ENV
          echo "QT631=$QT_PATH" >> $GITHUB_ENV
          echo "QT_ROOT=$QT_PATH" >> $GITHUB_ENV
          echo "QTDIR_RelWithDebInfo=$QT_PATH" >> $GITHUB_ENV
          echo "QTDIR_Release=$QT_PATH" >> $GITHUB_ENV
          echo "QTDIR_Debug=$QT_PATH" >> $GITHUB_ENV
          echo "$QT_PATH/bin" >> $GITHUB_PATH

      - name: Apply Velora Studio Branding, Colors & Ingest Presets
        shell: bash
        run: |
          bash velora-custom/scripts/rebrand-prism-to-velora.sh prism-src

      - name: Configure CMake & Generate Solution
        shell: cmd
        working-directory: prism-src/build/windows
        run: |
          echo QTDIR is %QTDIR%
          configure.cmd

      - name: Build Velora Studio with MSBuild
        shell: cmd
        working-directory: prism-src/src/prism-live-studio/build/Release
        run: |
          echo Compiling Primary Velora Studio Solution...
          msbuild prism-live-studio.sln /p:Configuration=RelWithDebInfo /p:Platform=x64 /p:TreatWarningsAsErrors=false /p:WarningLevel=3 /m /verbosity:minimal

      - name: Package Complete Velora Studio Distribution (Full FFmpeg, OBS-Deps & Qt Suite)
        shell: bash
        run: |
          mkdir -p dist/bin/64bit dist/data dist/obs-plugins/64bit
          
          # 1. Copy official PRISM & OBS output trees (RelWithDebInfo, Release, rundir)
          echo "Copying PRISM & OBS output trees..."
          for outdir in prism-src/bin/prism/windows/RelWithDebInfo prism-src/bin/prism/windows/Release prism-src/src/obs-studio/build/Release/rundir/RelWithDebInfo prism-src/src/obs-studio/build/Release/rundir/Release; do
            if [ -d "$outdir" ]; then
              echo "Copying tree from $outdir to dist..."
              cp -r "$outdir"/* dist/ 2>/dev/null || true
            fi
          done
          
          # 2. Copy ALL third-party dependencies from obs-deps & CEF (FFmpeg, libcurl, pthreads, srt, CEF pak/dat)
          echo "Bundling obs-deps and CEF assets..."
          find prism-src -path "*/.deps/*" -name "*.dll" -exec cp {} dist/bin/64bit/ \; 2>/dev/null || true
          find prism-src -path "*/cef_binary*/*" \( -name "*.pak" -o -name "*.dat" -o -name "*.bin" -o -name "*.dll" \) -exec cp {} dist/bin/64bit/ \; 2>/dev/null || true
          find prism-src -type d -path "*/cef_binary*/Resources/locales" | while read -r ldir; do
            mkdir -p dist/bin/64bit/locales
            cp -r "$ldir"/* dist/bin/64bit/locales/ 2>/dev/null || true
          done
          find prism-src -type d -path "*/cef_binary*/locales" | while read -r ldir; do
            mkdir -p dist/bin/64bit/locales
            cp -r "$ldir"/* dist/bin/64bit/locales/ 2>/dev/null || true
          done
          
          # Enable portable mode to keep configs localized
          touch dist/bin/64bit/obs_portable_mode
          touch dist/obs_portable_mode
          
          # 3. Copy internal common-libs and OBS DLLs into bin/64bit
          echo "Bundling compiled core DLLs..."
          find prism-src/src/prism-live-studio/build -name "*.dll" ! -path "*/obs-plugins/*" -exec cp {} dist/bin/64bit/ \; 2>/dev/null || true
          find prism-src/src/obs-studio/build -name "*.dll" ! -path "*/obs-plugins/*" -exec cp {} dist/bin/64bit/ \; 2>/dev/null || true

          # 4. Copy OBS plugins into obs-plugins/64bit
          echo "Bundling OBS plugins..."
          find prism-src -type d -path "*/obs-plugins/64bit" | while read -r pdir; do
            cp -r "$pdir"/* dist/obs-plugins/64bit/ 2>/dev/null || true
          done

          # 5. Copy all Data and Resource folders (themes, services, shaders, locales)
          echo "Bundling data assets and themes..."
          find prism-src -type d -path "*/UI/data" | while read -r d; do
            cp -r "$d"/* dist/data/ 2>/dev/null || true
          done
          find prism-src -type d -path "*/data/obs-studio" | while read -r d; do
            mkdir -p dist/data/obs-studio
            cp -r "$d"/* dist/data/obs-studio/ 2>/dev/null || true
          done
          find prism-src -type d -path "*/data/prism" | while read -r d; do
            mkdir -p dist/data/prism
            cp -r "$d"/* dist/data/prism/ 2>/dev/null || true
          done

          # Mirror data and plugins to bin/64bit so relative lookups always resolve
          mkdir -p dist/bin/64bit/data dist/bin/64bit/obs-plugins
          cp -r dist/data/* dist/bin/64bit/data/ 2>/dev/null || true
          cp -r dist/obs-plugins/* dist/bin/64bit/obs-plugins/ 2>/dev/null || true

          # 6. Bundle full Qt 6.5.3 runtime DLLs and plugin folders
          echo "Bundling Qt 6.5.3 runtime DLLs & plugins..."
          QT_BIN="${{ runner.temp }}/Qt/6.5.3/msvc2019_64/bin"
          QT_PLUGINS="${{ runner.temp }}/Qt/6.5.3/msvc2019_64/plugins"
          
          cp -r "$QT_BIN/"*.dll dist/bin/64bit/ 2>/dev/null || true
          cp -r "$QT_PLUGINS/platforms" dist/bin/64bit/ 2>/dev/null || true
          cp -r "$QT_PLUGINS/styles" dist/bin/64bit/ 2>/dev/null || true
          cp -r "$QT_PLUGINS/imageformats" dist/bin/64bit/ 2>/dev/null || true
          cp -r "$QT_PLUGINS/tls" dist/bin/64bit/ 2>/dev/null || true
          cp -r "$QT_PLUGINS/networkinformation" dist/bin/64bit/ 2>/dev/null || true
          cp -r "$QT_PLUGINS/multimedia" dist/bin/64bit/ 2>/dev/null || true

          # 7. Ensure VeloraStudio.exe exists in bin/64bit
          if [ -f "dist/bin/64bit/PRISMLiveStudio.exe" ]; then
            cp "dist/bin/64bit/PRISMLiveStudio.exe" "dist/bin/64bit/VeloraStudio.exe"
          elif [ -f "dist/bin/64bit/obs64.exe" ]; then
            cp "dist/bin/64bit/obs64.exe" "dist/bin/64bit/VeloraStudio.exe"
          fi

          # 8. Run windeployqt to guarantee all dependencies
          "$QT_BIN/windeployqt.exe" --release --no-translations dist/bin/64bit/VeloraStudio.exe --dir dist/bin/64bit 2>/dev/null || true

          # 9. Create 1-Click Root Launcher batch script
          printf '@echo off\r\ncd /d "%%~dp0bin\\64bit"\r\nif exist "VeloraStudio.exe" (\r\n    start "" "VeloraStudio.exe" %%*\r\n) else if exist "PRISMLiveStudio.exe" (\r\n    start "" "PRISMLiveStudio.exe" %%*\r\n) else if exist "obs64.exe" (\r\n    start "" "obs64.exe" %%*\r\n)\r\n' > "dist/Launch Velora Studio.bat"

      - name: Compile Native C++ Root Launcher (VeloraStudio.exe)
        shell: cmd
        run: |
          echo Compiling Native Win32 Launcher...
          cl /nologo /O2 /EHsc /Fe:dist\VeloraStudio.exe velora-custom\launcher\launcher.cpp /link /SUBSYSTEM:WINDOWS user32.lib shell32.lib
          if exist "dist\launcher.obj" del "dist\launcher.obj"

      - name: Upload Velora Studio Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velora-Studio-Windows-x64
          path: dist/
          if-no-files-found: warn
