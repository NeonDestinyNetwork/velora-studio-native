name: Build Velora Studio (PRISM Base - Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-velora-studio:
    runs-on: windows-2022

    steps:
      - name: Checkout Velora Studio Customizations
        uses: actions/checkout@v4
        with:
          path: velora-custom

      - name: Checkout PRISM Live Studio Base
        uses: actions/checkout@v4
        with:
          repository: naver/prism-live-studio
          submodules: recursive
          path: prism-src
          fetch-depth: 0

      - name: Setup MSBuild & Visual Studio 2022
        uses: microsoft/setup-msbuild@v2

      - name: Setup Qt 6.5.3 (LTS Full Module Suite)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: '${{ runner.temp }}'
          modules: 'qtmultimedia qtnetworkauth qtwebsockets qt5compat qtimageformats qtshadertools'

      - name: Set Qt Environment Variables
        shell: bash
        run: |
          echo "QT631=$QTDIR" >> $GITHUB_ENV
          echo "QTDIR=$QTDIR" >> $GITHUB_ENV
          echo "QT_ROOT=$QTDIR" >> $GITHUB_ENV
          echo "QTDIR_RelWithDebInfo=$QTDIR" >> $GITHUB_ENV
          echo "QTDIR_Release=$QTDIR" >> $GITHUB_ENV
          echo "QTDIR_Debug=$QTDIR" >> $GITHUB_ENV
          echo "$QTDIR/bin" >> $GITHUB_PATH

      - name: Apply Velora Studio Branding, Colors & Ingest Presets
        shell: bash
        run: |
          bash velora-custom/scripts/rebrand-prism-to-velora.sh prism-src

      - name: Configure CMake & Generate Solution
        shell: cmd
        working-directory: prism-src/build/windows
        run: |
          echo QTDIR is %QTDIR%
          configure.cmd

      - name: Build Velora Studio with MSBuild
        shell: cmd
        working-directory: prism-src/src/prism-live-studio/build/Release
        run: |
          echo Compiling Primary Velora Studio Solution...
          msbuild prism-live-studio.sln /p:Configuration=RelWithDebInfo /p:Platform=x64 /p:TreatWarningsAsErrors=false /p:WarningLevel=3 /m /verbosity:minimal

      - name: Package Complete Velora Studio Distribution (Full FFmpeg, OBS-Deps & Qt Suite)
        shell: bash
        run: |
          mkdir -p dist/bin/64bit dist/data dist/obs-plugins/64bit
          
          # 1. Copy full PRISM runtime bin output trees (RelWithDebInfo, Release, and bin)
          echo "Copying PRISM output tree..."
          for outdir in prism-src/bin/prism/windows/RelWithDebInfo prism-src/bin/prism/windows/Release prism-src/bin/prism prism-src/bin; do
            if [ -d "$outdir" ]; then
              echo "Copying from $outdir to dist..."
              cp -r "$outdir"/* dist/ 2>/dev/null || true
            fi
          done
          
          # 2. Copy ALL third-party dependencies from obs-deps (FFmpeg avcodec/avformat, libcurl, pthreads, srt, etc.)
          echo "Bundling obs-deps..."
          find prism-src -path "*/.deps/*" -name "*.dll" -exec cp {} dist/bin/64bit/ \; 2>/dev/null || true
          find prism-src -path "*/.deps/*" -name "*.dll" -exec cp {} dist/ \; 2>/dev/null || true
          
          # 3. Find and copy ALL built DLLs across the entire source & build tree (common-libs, libui, liblog, libutils-api, libobs, etc.)
          echo "Bundling all compiled DLLs..."
          find prism-src/src -name "*.dll" -exec cp {} dist/bin/64bit/ \; 2>/dev/null || true
          find prism-src/src -name "*.dll" -exec cp {} dist/ \; 2>/dev/null || true
          find prism-src/build -name "*.dll" -exec cp {} dist/bin/64bit/ \; 2>/dev/null || true
          find prism-src/build -name "*.dll" -exec cp {} dist/ \; 2>/dev/null || true
          find prism-src/bin -name "*.dll" -exec cp {} dist/bin/64bit/ \; 2>/dev/null || true
          find prism-src/bin -name "*.dll" -exec cp {} dist/ \; 2>/dev/null || true

          # 4. Copy all Data and Resource folders (themes, services, shaders, locales)
          echo "Bundling data assets and themes..."
          find prism-src -type d -path "*/UI/data" | while read -r d; do
            cp -r "$d"/* dist/data/ 2>/dev/null || true
          done
          if [ -d "dist/data" ]; then
            mkdir -p dist/bin/64bit/data
            cp -r dist/data/* dist/bin/64bit/data/ 2>/dev/null || true
          fi
          
          # 5. Bundle full Qt 6.5.3 runtime DLLs and plugins
          echo "Bundling Qt 6.5.3 runtime DLLs..."
          cp -r "$QTDIR/bin/"*.dll dist/bin/64bit/ 2>/dev/null || true
          cp -r "$QTDIR/bin/"*.dll dist/ 2>/dev/null || true
          cp -r "$QTDIR/plugins" dist/bin/64bit/ 2>/dev/null || true
          cp -r "$QTDIR/plugins" dist/ 2>/dev/null || true
          
          # 6. Ensure VeloraStudio.exe exists in root and bin/64bit
          for exename in PRISMLiveStudio.exe VeloraStudio.exe obs64.exe; do
            find prism-src -name "$exename" | while read -r src_exe; do
              cp "$src_exe" dist/bin/64bit/ 2>/dev/null || true
              cp "$src_exe" dist/ 2>/dev/null || true
            done
          done

          if [ -f "dist/bin/64bit/PRISMLiveStudio.exe" ]; then
            cp "dist/bin/64bit/PRISMLiveStudio.exe" "dist/bin/64bit/VeloraStudio.exe"
            cp "dist/bin/64bit/PRISMLiveStudio.exe" "dist/VeloraStudio.exe"
          fi
          if [ -f "dist/PRISMLiveStudio.exe" ]; then
            cp "dist/PRISMLiveStudio.exe" "dist/VeloraStudio.exe"
            cp "dist/PRISMLiveStudio.exe" "dist/bin/64bit/VeloraStudio.exe" 2>/dev/null || true
          fi
          
          # 7. Create 1-Click Root Launcher script
          cat << 'EOF' > "dist/Launch Velora Studio.bat"
@echo off
cd /d "%~dp0bin\64bit"
if exist "VeloraStudio.exe" (
    start "" "VeloraStudio.exe" %*
) else if exist "PRISMLiveStudio.exe" (
    start "" "PRISMLiveStudio.exe" %*
) else if exist "obs64.exe" (
    start "" "obs64.exe" %*
)
EOF
          
          # 8. Run windeployqt
          find dist -name "*.exe" | while read -r exe; do
            windeployqt --release --no-translations "$exe" 2>/dev/null || true
          done
          
          echo "=== Content of dist root ==="
          ls -la dist/ || true
          echo "=== Content of dist/bin/64bit ==="
          ls -la dist/bin/64bit/ || true

      - name: Upload Velora Studio Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velora-Studio-Windows-x64
          path: dist/
          if-no-files-found: warn
