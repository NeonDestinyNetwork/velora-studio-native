name: Build Velora Studio (Windows Native)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Velora Studio Configs
        uses: actions/checkout@v4
        with:
          path: velora-config

      - name: Checkout OBS Studio Core
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: '30.2.3'
          submodules: recursive
          path: obs-studio

      - name: Setup Ninja & CMake
        uses: ashutoshvarma/setup-ninja@v1.1
        with:
          version: 1.11.1

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Inject Velora Branding & WHIP Presets
        shell: bash
        run: |
          echo "Injecting Velora Theme..."
          cp velora-config/theme/VeloraDark.qss obs-studio/UI/data/themes/
          cp velora-config/config/services.json obs-studio/plugins/obs-outputs/data/

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -S obs-studio -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_WHIP=ON \
            -DENABLE_BROWSER=ON \
            -DENABLE_AJA=OFF

      - name: Compile Velora Studio
        shell: bash
        run: |
          ninja -C build

      - name: Package Velora Studio Installer
        shell: bash
        run: |
          cpack --config build/CPackConfig.cmake -B package

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VeloraStudio-Windows-x64
          path: package/*.exe
